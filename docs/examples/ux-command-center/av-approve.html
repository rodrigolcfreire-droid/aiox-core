<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOS — Biblioteca de Cortes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;
  --bg-2:#0d1117;
  --bg-3:#131a2b;
  --line:rgba(255,255,255,0.1);
  --line-2:rgba(255,255,255,0.16);
  --text:#f1f4ff;
  --text-2:#a0a8b8;
  --text-3:#5a6478;
  --cyan:#00e5cc;
  --green:#00e5cc;
  --yellow:#ffd24a;
  --red:#ff5566;
  --pink:#ff4088;
  --blue:#5b9dff;
  --purple:#b070ff;
  --orange:#ff9a55;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* ============ SIDEBAR ============ */
.side{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 4px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--text);color:#000;display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px}
.brand-name em{font-style:normal;color:var(--text-3);margin-left:6px;font-size:12px;letter-spacing:2px}

.nav-section{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10px;color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase;padding:0 8px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.nav-item:hover{background:var(--bg-2);color:var(--text)}
.nav-item.on{background:var(--bg-3);color:var(--text)}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.nav-item.on .dot,.nav-item:hover .dot{background:currentColor}
.nav-item[data-c="viral"] .dot{background:var(--pink)}
.nav-item[data-c="educativo"] .dot{background:var(--blue)}
.nav-item[data-c="cta"] .dot{background:var(--green)}
.nav-item[data-c="tendencia"] .dot{background:var(--yellow)}
.nav-item[data-c="autoridade"] .dot{background:var(--purple)}
.nav-item[data-c="storytelling"] .dot{background:var(--orange)}
.nav-item[data-c="bastidores"] .dot{background:var(--cyan)}
.nav-item .count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3)}

.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:11px;font-family:'JetBrains Mono',monospace}
.side-foot .live{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green)}

/* ============ MAIN ============ */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,11,.85);backdrop-filter:blur(12px);z-index:10}
.title{display:flex;flex-direction:column;gap:2px}
.title h1{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;font-weight:400}
.title small{font-size:11px;color:var(--text-3);font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.search{position:relative;flex:1;max-width:380px;margin-left:24px}
.search input{width:100%;padding:9px 12px 9px 34px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--line-2)}
.search input::placeholder{color:var(--text-3)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.sel{background:var(--bg-2);border:1px solid var(--line);color:var(--text-2);padding:8px 12px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;outline:none}
.sel:hover{border-color:var(--line-2);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:12px;font-weight:600;letter-spacing:.3px;border:1px solid var(--line);color:var(--text-2);background:var(--bg-2)}
.btn:hover{border-color:var(--line-2);color:var(--text)}
.btn.primary{background:var(--text);color:#000;border-color:var(--text)}
.btn.primary:hover{opacity:.88}

/* selection bar */
.selbar{display:none;align-items:center;gap:10px;padding:10px 28px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12px}
.selbar.show{display:flex}
.selbar .count{font-family:'JetBrains Mono',monospace;color:var(--text);font-weight:500}
.selbar .sep{color:var(--text-3)}
.selbar button{color:var(--text-2);font-size:12px;padding:5px 10px;border-radius:7px}
.selbar button:hover{background:var(--bg-3);color:var(--text)}
.selbar button.ok{color:var(--green)}
.selbar button.no{color:var(--red)}

/* meta strip */
.meta{display:flex;align-items:center;gap:24px;padding:14px 28px;border-bottom:1px solid var(--line);color:var(--text-3);font-size:12px;font-family:'JetBrains Mono',monospace}
.meta b{color:var(--text);font-weight:500;margin-right:4px}
.meta .grow{flex:1}

/* ============ GRID ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px;padding:24px 28px 60px}
.item{display:flex;flex-direction:column;gap:10px;cursor:pointer;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.thumb{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--bg-2);transition:transform .2s ease}
.item:hover .thumb{transform:translateY(-2px)}
.thumb::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none}
.item.selected .thumb::after{box-shadow:inset 0 0 0 2px var(--text)}
.item.approved .thumb::after{box-shadow:inset 0 0 0 1px rgba(0,255,136,.35)}
.item.rejected{opacity:.32}

/* thumb visual (placeholder) */
.thumb-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1b1b22 0%,#0e0e12 100%);display:flex;align-items:center;justify-content:center}
.thumb-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.04),transparent 60%)}
.play{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);transition:transform .2s,background .2s}
.item:hover .play{background:rgba(0,0,0,.7);transform:scale(1.05)}
.play::after{content:'';border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent rgba(255,255,255,.92);margin-left:3px}

/* duration top-left */
.dur{position:absolute;top:10px;left:10px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;letter-spacing:.3px}
.headline-overlay{position:absolute;top:50%;left:12px;right:12px;transform:translateY(-50%);padding:11px 14px;background:rgba(10,14,26,.55);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 6px 20px rgba(0,0,0,.35);color:#f1f4ff;font-family:'DM Sans',system-ui,sans-serif;font-size:13.5px;font-weight:700;text-align:center;letter-spacing:.1px;line-height:1.25;pointer-events:none;z-index:2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.headline-overlay::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.headline-overlay:empty{display:none}
.headline-overlay.top{top:15%}
.headline-overlay.top:hover,.item:hover .headline-overlay.top{transform:translateY(-50%) scale(1.02)}
.item:hover .headline-overlay{background:rgba(10,14,26,.7);transform:translateY(-50%) scale(1.02);transition:all .25s ease}

/* score top-right */
.score{position:absolute;top:8px;right:10px;text-align:right;line-height:1}
.score-val{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.5px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.score-lbl{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:1.5px;font-weight:600;text-transform:uppercase;margin-top:2px}
.s-high{color:var(--green)}
.s-mid{color:var(--yellow)}
.s-low{color:var(--red)}

/* category dot bottom-left */
.cat{position:absolute;left:10px;bottom:54px;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:20px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.cat .d{width:6px;height:6px;border-radius:50%}
.cat[data-c="viral"] .d{background:var(--pink)}
.cat[data-c="educativo"] .d{background:var(--blue)}
.cat[data-c="cta"] .d{background:var(--green)}
.cat[data-c="tendencia"] .d{background:var(--yellow)}
.cat[data-c="autoridade"] .d{background:var(--purple)}
.cat[data-c="storytelling"] .d{background:var(--orange)}
.cat[data-c="bastidores"] .d{background:var(--cyan)}

/* action icons (bottom-right cluster, under score) */
.ico-cluster{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateX(4px);transition:opacity .2s,transform .2s}
.item:hover .ico-cluster,.item.selected .ico-cluster{opacity:1;transform:none}
.ico{width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.06);transition:background .15s,color .15s}
.ico:hover{background:rgba(255,255,255,.95);color:#000}
.ico.ok:hover{background:var(--green);color:#000}
.ico.no:hover{background:var(--red);color:#fff}

/* approved tag */
.aptag{position:absolute;left:10px;top:42px;background:var(--green);color:#000;font-size:9px;font-weight:800;padding:3px 8px;border-radius:5px;letter-spacing:1px;display:none}
.item.approved .aptag{display:block}

/* card body */
.body{display:flex;align-items:flex-start;gap:10px;padding:0 2px}
.title-row{flex:1;min-width:0}
.h-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.h-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);font-family:'JetBrains Mono',monospace}
.h-meta .sep{opacity:.5}
.check{flex-shrink:0;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;display:grid;place-items:center;color:transparent;transition:all .15s;margin-top:2px}
.item.selected .check{background:var(--text);border-color:var(--text);color:#000}
.item:hover .check{border-color:var(--text-2)}

.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-3);font-size:14px}

/* responsive */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:18px}
  .topbar{padding:14px 18px}
  .meta{padding:12px 18px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">AIOS<em>CUT</em></div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Biblioteca</div>
      <div class="nav-item on" data-c="all" onclick="setFilter('all',this)">
        <span class="dot"></span><span>Todos</span><span class="count" id="c-all">0</span>
      </div>
      <div class="nav-item" data-c="pending" onclick="setFilter('pending',this)">
        <span class="dot"></span><span>Pendentes</span><span class="count" id="c-pending">0</span>
      </div>
      <div class="nav-item" data-c="approved" onclick="setFilter('approved',this)">
        <span class="dot" style="background:var(--green)"></span><span>Aprovados</span><span class="count" id="c-approved">0</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Categorias</div>
      <div class="nav-item" data-c="viral" onclick="setFilter('viral',this)">
        <span class="dot"></span><span>Viral</span><span class="count" id="c-viral">0</span>
      </div>
      <div class="nav-item" data-c="educativo" onclick="setFilter('educativo',this)">
        <span class="dot"></span><span>Educativo</span><span class="count" id="c-educativo">0</span>
      </div>
      <div class="nav-item" data-c="cta" onclick="setFilter('cta',this)">
        <span class="dot"></span><span>CTA</span><span class="count" id="c-cta">0</span>
      </div>
      <div class="nav-item" data-c="tendencia" onclick="setFilter('tendencia',this)">
        <span class="dot"></span><span>Tendência</span><span class="count" id="c-tendencia">0</span>
      </div>
      <div class="nav-item" data-c="autoridade" onclick="setFilter('autoridade',this)">
        <span class="dot"></span><span>Autoridade</span><span class="count" id="c-autoridade">0</span>
      </div>
      <div class="nav-item" data-c="storytelling" onclick="setFilter('storytelling',this)">
        <span class="dot"></span><span>Storytelling</span><span class="count" id="c-storytelling">0</span>
      </div>
      <div class="nav-item" data-c="bastidores" onclick="setFilter('bastidores',this)">
        <span class="dot"></span><span>Bastidores</span><span class="count" id="c-bastidores">0</span>
      </div>
    </div>

    <div class="side-foot">
      <span class="live"></span><span id="srv-status">api: localhost:3456</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <!-- Top bar -->
    <header class="topbar">
      <div class="title">
        <h1>Biblioteca de Cortes</h1>
        <small id="proj-id">— carregando projeto —</small>
      </div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Buscar título, transcrição..." oninput="render()">
      </label>
      <div class="tools">
        <select class="sel" onchange="setSort(this.value)">
          <option value="score">Ordenar: Score ↓</option>
          <option value="duration">Duração ↓</option>
          <option value="status">Pendentes 1º</option>
          <option value="recent">Mais recentes</option>
        </select>
        <button class="btn" onclick="toggleSelectMode()" id="selbtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
          Selecionar
        </button>
        <button class="btn primary" onclick="upload()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
        </button>
      </div>
    </header>

    <!-- Selection bar -->
    <div class="selbar" id="selbar">
      <span class="count" id="sel-count">0 selecionados</span>
      <span class="sep">·</span>
      <button class="ok" onclick="bulkApprove()">Aprovar</button>
      <button class="no" onclick="bulkReject()">Rejeitar</button>
      <button onclick="bulkExport()">Exportar</button>
      <span class="grow" style="flex:1"></span>
      <button onclick="clearSel()">Cancelar</button>
    </div>

    <!-- Meta strip -->
    <div class="meta">
      <span><b id="m-total">0</b>vídeos</span>
      <span><b id="m-approved" style="color:var(--green)">0</b>aprovados</span>
      <span><b id="m-pending">0</b>pendentes</span>
      <span class="grow"></span>
      <span id="m-filter">filtro: todos</span>
    </div>

    <!-- Grid -->
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
const API='http://localhost:3456';
const projectId=new URLSearchParams(location.search).get('project')||'9a5dacdf-9c1e-4f94-8ff4-acc231da0b1e';
let allCuts=[];
let activeFilter='all';
let activeSort='score';
let selectMode=false;
let selected=new Set();

const MOCK=[
  {id:'cut_001',score:99,category:'viral',duration:88,platforms:['reels','tiktok','shorts'],title:'Lucro Diário: A Verdade Sobre Ganhos no Trading',transcript_excerpt:'50 reais por dia é LUCRO. Pense nisso.',status:'pending',createdAt:'2026-05-04T10:00:00Z'},
  {id:'cut_002',score:92,category:'educativo',duration:63,platforms:['reels','tiktok','shorts'],title:'Lucro Rápido? Mentira! Gestão Segura é o Segredo',transcript_excerpt:'Lucro rápido? MENTIRA. Disciplina é o segredo.',status:'pending',createdAt:'2026-05-04T09:30:00Z'},
  {id:'cut_003',score:85,category:'storytelling',duration:84,platforms:['reels','tiktok','shorts'],title:'Do Sofrimento ao Sucesso: Estratégia Revelada',transcript_excerpt:'Não opere sem ler o gráfico',status:'pending',createdAt:'2026-05-04T09:00:00Z'},
  {id:'cut_004',score:84,category:'autoridade',duration:47,platforms:['feed','youtube'],title:'Domine o Gráfico: Leitura Essencial',transcript_excerpt:'De R$700 a um trader consistente.',status:'approved',createdAt:'2026-05-04T08:30:00Z'},
  {id:'cut_005',score:81,category:'cta',duration:71,platforms:['reels','tiktok'],title:'Mentalidade de Trading: A Chave para a Constância',transcript_excerpt:'Picos de Dopamina Geram Perdas. Mantenha a Calma.',status:'pending',createdAt:'2026-05-04T08:00:00Z'},
  {id:'cut_006',score:78,category:'educativo',duration:84,platforms:['reels','shorts'],title:'Dobrar Salário? Não Cometa Este Erro',transcript_excerpt:'Dobrar salário? Não cometa este erro.',status:'pending',createdAt:'2026-05-04T07:30:00Z'},
  {id:'cut_007',score:74,category:'viral',duration:65,platforms:['tiktok','shorts'],title:'Pare de Dobrar a Aposta: Tenha Calma',transcript_excerpt:'Pare de dobrar a aposta! Tenha calma.',status:'pending',createdAt:'2026-05-04T07:00:00Z'},
  {id:'cut_008',score:71,category:'educativo',duration:62,platforms:['reels','shorts'],title:'30 Min no Gráfico: Paciência Para Esperar',transcript_excerpt:'De 30 min no gráfico a paciência para esperar.',status:'pending',createdAt:'2026-05-04T06:30:00Z'},
  {id:'cut_009',score:68,category:'autoridade',duration:86,platforms:['feed','youtube'],title:'Mude Sua Mentalidade, Mude Seu Jogo',transcript_excerpt:'Mude sua mentalidade, mude seu jogo.',status:'pending',createdAt:'2026-05-04T06:00:00Z'},
  {id:'cut_010',score:65,category:'cta',duration:67,platforms:['reels','tiktok'],title:'Carlos: Por Que Você Ainda Joga?',transcript_excerpt:'Carlos: Por que você ainda joga?',status:'approved',createdAt:'2026-05-04T05:30:00Z'},
  {id:'cut_011',score:60,category:'tendencia',duration:90,platforms:['feed','youtube'],title:'Gestão de Risco: Segredo dos Profissionais',transcript_excerpt:'Gestão de risco é o segredo dos profissionais.',status:'pending',createdAt:'2026-05-04T05:00:00Z'},
  {id:'cut_012',score:58,category:'bastidores',duration:55,platforms:['reels','tiktok'],title:'Dia Real de Quem Vive de Trading',transcript_excerpt:'Como é o dia de quem vive disso de verdade.',status:'pending',createdAt:'2026-05-04T04:30:00Z'}
];

async function loadCuts(){
  document.getElementById('proj-id').textContent='proj: '+projectId.slice(0,8);
  try{
    const r=await fetch(`${API}/api/projects/${projectId}/cuts`);
    if(!r.ok)throw new Error('http '+r.status);
    const data=await r.json();
    allCuts=(data.suggestedCuts||data.cuts||data||[]).map(c=>({status:'pending',...c,score:c.score??c.engagementScore,platforms:c.platforms||c.platform||[],title:c.title||c.viralTitle||c.transcriptExcerpt?.slice(0,80)||'(sem titulo)',transcript_excerpt:c.transcript_excerpt||c.transcriptExcerpt}));
    document.getElementById('srv-status').textContent='api: online';
  }catch(e){
    allCuts=MOCK;
    document.getElementById('srv-status').textContent='api: offline (mock)';
  }
  render();
}

function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return`${m}:${String(s).padStart(2,'0')}`}
function scoreClass(s){return s>=80?'s-high':s>=60?'s-mid':'s-low'}

function counts(){
  const by={all:allCuts.length,pending:0,approved:0,viral:0,educativo:0,cta:0,tendencia:0,autoridade:0,storytelling:0,bastidores:0};
  for(const c of allCuts){
    if(c.status==='pending')by.pending++;
    else if(c.status==='approved')by.approved++;
    if(by[c.category]!==undefined)by[c.category]++;
  }
  for(const k in by){const el=document.getElementById('c-'+k);if(el)el.textContent=by[k];}
  document.getElementById('m-total').textContent=by.all;
  document.getElementById('m-approved').textContent=by.approved;
  document.getElementById('m-pending').textContent=by.pending;
}

function applyFilter(c){
  if(activeFilter==='all')return true;
  if(activeFilter==='pending')return c.status==='pending';
  if(activeFilter==='approved')return c.status==='approved';
  return c.category===activeFilter;
}

function render(){
  const grid=document.getElementById('grid');
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  let cuts=allCuts.filter(applyFilter);
  if(q){
    cuts=cuts.filter(c=>(c.title||'').toLowerCase().includes(q)||(c.transcript_excerpt||'').toLowerCase().includes(q));
  }
  if(activeSort==='score')cuts.sort((a,b)=>b.score-a.score);
  else if(activeSort==='duration')cuts.sort((a,b)=>b.duration-a.duration);
  else if(activeSort==='recent')cuts.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  else cuts.sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));

  counts();
  document.getElementById('m-filter').textContent='filtro: '+activeFilter;

  if(!cuts.length){
    grid.innerHTML='<div class="empty">Nenhum corte encontrado.</div>';
    return;

    const sel=selected.has(c.id)?'selected':'';
    return `
    <div class="item ${c.status} ${sel}" data-id="${c.id}" style="animation-delay:${i*22}ms" onclick="onItemClick(event,'${c.id}')">

        </div>
        <div class="cat" data-c="${c.category}"><span class="d"></span>${c.category}</div>
        <div class="ico-cluster" onclick="event.stopPropagation()">
          <button class="ico" title="Agendar publicação" onclick="schedule('${c.id}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

// Analisa thumbnail e posiciona headline: split-screen → meio (default), single-screen → topo
function detectLayoutsAndPosition(){
  document.querySelectorAll('.thumb').forEach(thumb=>{
    const overlay=thumb.querySelector('.headline-overlay');
    if(!overlay||!overlay.textContent.trim())return;
    if(overlay.dataset.analyzed)return;
    const bg=thumb.querySelector('.thumb-bg');
    if(!bg)return;
    const m=(bg.style.backgroundImage||'').match(/url\(['"]?([^'")]+)['"]?\)/);
    if(!m)return;
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const W=32,H=64;
        const cv=document.createElement('canvas');
        cv.width=W;cv.height=H;
        const ctx=cv.getContext('2d');
        ctx.drawImage(img,0,0,W,H);
        const data=ctx.getImageData(0,0,W,H).data;
        const lum=[];
        for(let y=0;y<H;y++){
          let s=0;
          for(let x=0;x<W;x++){
            const i=(y*W+x)*4;
            s+=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
          }
          lum.push(s/W);
        }
        // procurar valley no centro (rows 24-40 = 37%-63%)
        let minIdx=24,minVal=lum[24];
        for(let y=25;y<=40;y++) if(lum[y]<minVal){minVal=lum[y];minIdx=y;}
        const above=lum.slice(8,18).reduce((a,b)=>a+b,0)/10;
        const below=lum.slice(46,56).reduce((a,b)=>a+b,0)/10;
        // split: existe valley significativa no meio (faixa preta) E o valley é mais escuro que entorno
        const isSplit=minVal<60 && (above-minVal>25) && (below-minVal>25);
        if(!isSplit) overlay.classList.add('top');
        overlay.dataset.analyzed='1';
      }catch(e){overlay.dataset.analyzed='1';}
    };
    img.onerror=()=>{overlay.dataset.analyzed='1';};
    img.src=m[1];
  });
}

function onItemClick(e,id){
  if(selectMode||e.shiftKey||e.metaKey||e.ctrlKey){
    if(selected.has(id))selected.delete(id);else selected.add(id);
    render();
    return;
  }
  // default click → preview placeholder
  preview(id);
}

function preview(id){

  if(!c)return;
  let m=document.getElementById('previewModal');
  if(m)m.remove();
  m=document.createElement('div');

  const close=()=>{const v=m.querySelector('video');if(v)v.pause();m.remove();document.removeEventListener('keydown',onKey);};
  const onKey=(e)=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',onKey);
  m.onclick=(e)=>{if(e.target===m)close();};
  const swatches=[
    {key:'navy',label:'Navy',bg:'linear-gradient(135deg,#14213a,#06080f)',border:'rgba(255,255,255,0.18)',text:'#f1f4ff'},
    {key:'white',label:'White',bg:'linear-gradient(135deg,#ffffff,#e6e6ec)',border:'rgba(0,0,0,0.12)',text:'#0a0e1a'},
    {key:'red',label:'Red',bg:'linear-gradient(135deg,#dc263c,#a01428)',border:'rgba(255,255,255,0.18)',text:'#fff'},
    {key:'gold',label:'Gold',bg:'linear-gradient(135deg,#d4af37,#96781e)',border:'rgba(255,235,180,0.3)',text:'#1a1408'},
    {key:'green',label:'Green',bg:'linear-gradient(135deg,#14a050,#0a5a2d)',border:'rgba(255,255,255,0.18)',text:'#fff'},
  ];
  const current=c.headlineStyle||'navy';
  const swStyle=swatches.find(s=>s.key===current);
  const initText=(c.viralTitle||'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F2FF}\u{1F900}-\u{1F9FF}]/gu,'').replace(/\s+/g,' ').trim();
  m.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;align-items:center;cursor:default" onclick="event.stopPropagation()">
    <div id="vidWrap" style="position:relative;display:inline-block;border-radius:12px;overflow:hidden;background:#000">
      <video id="prevVid" controls autoplay muted style="display:block;max-width:90vw;max-height:70vh" src="${API}/api/projects/${projectId}/preview/${c.id}.mp4?v=${Date.now()}"></video>
      <div id="hOverlay" style="position:absolute;left:50%;top:30%;transform:translateX(-50%);max-width:80%;padding:14px 24px;background:linear-gradient(180deg,rgba(20,28,48,.82),rgba(6,10,20,.85));color:${swStyle.text};font-family:'DM Sans',sans-serif;font-weight:700;font-size:18px;text-align:center;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14),0 6px 20px rgba(0,0,0,.4);cursor:move;user-select:none;line-height:1.2;white-space:normal"><span id="hOverlayText" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis">${initText}</span><div id="hResize" style="position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#fff;border:2px solid #0a0e1a;border-radius:50%;cursor:nwse-resize"></div></div>
    </div>
    <div id="restyleBar" style="display:flex;flex-direction:column;gap:12px;align-items:center;font-family:'DM Sans',sans-serif;font-size:12px;color:#a0a8b8;padding:14px 18px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.06)">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center">
        <span style="opacity:.6;letter-spacing:.5px">COR:</span>
        <label style="position:relative;width:34px;height:34px;border-radius:50%;cursor:pointer;overflow:hidden;border:2px solid rgba(255,255,255,.2);background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);display:grid;place-items:center" title="Escolher cor livre">
          <input type="color" id="hColorPicker" value="#14213a" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" style="pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </label>
        <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:4px 8px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6478">#</span>
          <input type="text" id="hHexInput" value="14213a" maxlength="6" spellcheck="false" style="width:62px;background:transparent;border:none;color:#f1f4ff;font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;outline:none;letter-spacing:.5px">
        </div>
        <span style="opacity:.3">·</span>
        ${swatches.map(s=>`<button data-style="${s.key}" title="${s.label}" style="width:26px;height:26px;border-radius:50%;background:${s.bg};border:2px solid ${current===s.key?'#fff':s.border};cursor:pointer;transition:transform .15s;padding:0" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'"></button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;font-size:11px;opacity:.55">
        <span>arraste a faixa · puxe o canto pra redimensionar · dica: clique no círculo arco-íris pra cor livre</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="hApply" style="padding:8px 18px;border-radius:8px;background:#00e5cc;color:#0a0e1a;border:none;cursor:pointer;font-family:'DM Sans';font-size:13px;font-weight:700">Aplicar no vídeo</button>
        <button id="hReset" style="padding:8px 14px;border-radius:8px;background:rgba(255,255,255,0.06);color:#a0a8b8;border:1px solid rgba(255,255,255,0.12);cursor:pointer;font-family:'DM Sans';font-size:12px">Resetar</button>
        <span id="restyleStatus" style="margin-left:8px;font-size:11px;color:#5a6478;min-height:14px"></span>
      </div>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5a6478">
      ${c.id} · ${c.category} · score ${c.score} · ${fmt(c.duration)} · ${(c.platforms||[]).join(' · ')||'sem plataforma'}
    </div>
  </div>`;
  document.body.appendChild(m);
  // Drag + resize state
  const overlay=m.querySelector('#hOverlay');
  const handle=m.querySelector('#hResize');
  const vid=m.querySelector('#prevVid');
  const wrap=m.querySelector('#vidWrap');
  let activeStyle=current;
  let activeHex=null;
  const fullText=initText;
  const clampTwoLines=(txt,wPx,fsPx)=>{
    const innerW=Math.max(40,wPx-48);
    const avgChar=fsPx*0.52;
    const cpl=Math.max(4,Math.floor(innerW/avgChar));
    const maxC=cpl*2;
    if(txt.length<=maxC)return txt;
    let cut=txt.slice(0,maxC-1);
    const ls=cut.lastIndexOf(' ');
    if(ls>maxC*0.7)cut=cut.slice(0,ls);
    return cut.replace(/[\s.,;:!?-]+$/,'')+'…';
  };
  const refreshClamp=()=>{
    const span=m.querySelector('#hOverlayText');if(!span)return;
    const w=overlay.offsetWidth;
    const fs=parseFloat(getComputedStyle(overlay).fontSize);
    span.textContent=clampTwoLines(fullText,w,fs);
  };
  const hexToRgb=(h)=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};};
  const luminance=(r,g,b)=>{const a=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*a[0]+.7152*a[1]+.0722*a[2];};
  const darken=(r,g,b,f)=>({r:Math.round(r*f),g:Math.round(g*f),b:Math.round(b*f)});
  const contrastText=(hex)=>{const{r,g,b}=hexToRgb(hex);return luminance(r,g,b)>.55?'#0a0e1a':'#f1f4ff';};
  const buildHexBg=(hex)=>{const{r,g,b}=hexToRgb(hex);const d=darken(r,g,b,.65);return `linear-gradient(180deg,rgba(${r},${g},${b},.85),rgba(${d.r},${d.g},${d.b},.88))`;};
  const applyOverlayStyle=(key)=>{
    const sw=swatches.find(s=>s.key===key);
    if(!sw)return;
    if(key==='navy')overlay.style.background='linear-gradient(180deg,rgba(20,28,48,.82),rgba(6,10,20,.85))';
    if(key==='white')overlay.style.background='linear-gradient(180deg,rgba(255,255,255,.92),rgba(235,235,240,.88))';
    if(key==='red')overlay.style.background='linear-gradient(180deg,rgba(220,38,60,.85),rgba(160,20,40,.88))';
    if(key==='gold')overlay.style.background='linear-gradient(180deg,rgba(212,175,55,.85),rgba(150,120,30,.88))';
    if(key==='green')overlay.style.background='linear-gradient(180deg,rgba(20,160,80,.85),rgba(10,90,45,.88))';
    overlay.style.color=sw.text;
    activeStyle=key;activeHex=null;
    syncSwatchBorders();
  };
  const applyCustomHex=(hex)=>{
    if(!/^#?[0-9a-fA-F]{6}$/.test(hex))return false;
    if(!hex.startsWith('#'))hex='#'+hex;
    overlay.style.background=buildHexBg(hex);
    overlay.style.color=contrastText(hex);
    activeStyle='custom';activeHex=hex.toLowerCase();
    syncSwatchBorders();
    return true;
  };
  const syncSwatchBorders=()=>{
    m.querySelectorAll('#restyleBar button[data-style]').forEach(b=>{
      const sw=swatches.find(s=>s.key===b.dataset.style);
      b.style.borderColor=(activeStyle===b.dataset.style)?'#fff':sw.border;
    });
  };
  // Drag
  let drag=null;
  overlay.addEventListener('mousedown',(e)=>{
    if(e.target===handle)return;
    e.preventDefault();
    const rect=overlay.getBoundingClientRect();
    drag={offX:e.clientX-rect.left,offY:e.clientY-rect.top};
  });
  document.addEventListener('mousemove',(e)=>{
    if(!drag)return;
    const wr=wrap.getBoundingClientRect();
    let nx=e.clientX-wr.left-drag.offX;
    let ny=e.clientY-wr.top-drag.offY;
    nx=Math.max(0,Math.min(wr.width-overlay.offsetWidth,nx));
    ny=Math.max(0,Math.min(wr.height-overlay.offsetHeight,ny));
    overlay.style.left=nx+'px';
    overlay.style.top=ny+'px';
    overlay.style.transform='none';
  });
  document.addEventListener('mouseup',()=>{drag=null;});
  // Resize
  let rsz=null;
  handle.addEventListener('mousedown',(e)=>{
    e.stopPropagation();e.preventDefault();
    const rect=overlay.getBoundingClientRect();
    rsz={startX:e.clientX,startY:e.clientY,startW:rect.width,startFs:parseFloat(getComputedStyle(overlay).fontSize)};
  });
  document.addEventListener('mousemove',(e)=>{
    if(!rsz)return;
    const dw=e.clientX-rsz.startX;
    const newW=Math.max(120,Math.min(wrap.offsetWidth-20,rsz.startW+dw));
    const ratio=newW/rsz.startW;
    overlay.style.maxWidth='none';
    overlay.style.width=newW+'px';
    overlay.style.fontSize=Math.max(10,Math.min(60,rsz.startFs*ratio))+'px';
    refreshClamp();
  });
  document.addEventListener('mouseup',()=>{rsz=null;});
  // Color swatch updates overlay live
  m.querySelectorAll('#restyleBar button[data-style]').forEach(btn=>{
    btn.addEventListener('click',(e)=>{e.stopPropagation();applyOverlayStyle(btn.dataset.style);
      const hi=m.querySelector('#hHexInput');const cp=m.querySelector('#hColorPicker');
      const sw=swatches.find(s=>s.key===btn.dataset.style);
      const pre={navy:'#14213a',white:'#ffffff',red:'#dc263c',gold:'#d4af37',green:'#14a050'}[btn.dataset.style];
      if(pre){if(hi)hi.value=pre.slice(1).toUpperCase();if(cp)cp.value=pre;}
    });
  });
  // Custom color picker
  const cp=m.querySelector('#hColorPicker');
  const hi=m.querySelector('#hHexInput');
  cp.addEventListener('input',(e)=>{e.stopPropagation();const v=cp.value;if(applyCustomHex(v))hi.value=v.slice(1).toUpperCase();});
  cp.addEventListener('click',(e)=>e.stopPropagation());
  hi.addEventListener('input',(e)=>{e.stopPropagation();const v=hi.value.replace(/[^0-9a-fA-F]/g,'').slice(0,6);if(v!==hi.value)hi.value=v.toUpperCase();if(v.length===6&&applyCustomHex('#'+v))cp.value='#'+v.toLowerCase();});
  hi.addEventListener('click',(e)=>e.stopPropagation());
  hi.addEventListener('keydown',(e)=>e.stopPropagation());
  // Reset
  m.querySelector('#hReset').addEventListener('click',(e)=>{
    e.stopPropagation();
    overlay.style.left='';overlay.style.top='30%';overlay.style.transform='translateX(-50%)';
    overlay.style.width='';overlay.style.maxWidth='80%';overlay.style.fontSize='18px';
    setTimeout(refreshClamp,0);
  });
  setTimeout(refreshClamp,30);
  // Apply: send custom coords
  m.querySelector('#hApply').addEventListener('click',async (e)=>{
    e.stopPropagation();
    const status=m.querySelector('#restyleStatus');
    const allBtns=m.querySelectorAll('#restyleBar button');
    allBtns.forEach(b=>b.disabled=true);
    status.textContent='Aplicando...';
    // Map screen coords to video coords (1280 high, 720 wide internally)
    const wr=wrap.getBoundingClientRect();
    const ovr=overlay.getBoundingClientRect();
    const scaleX=720/wr.width;
    const scaleY=1280/wr.height;
    const screenFs=parseFloat(getComputedStyle(overlay).fontSize);
    const customX=Math.round((ovr.left-wr.left)*scaleX);
    const customY=Math.round((ovr.top-wr.top)*scaleY);
    const customWidth=Math.round(ovr.width*scaleX);
    // overlay font 18px ~= burned 38pt at default. Maintain ratio: burned = screenFs * (38/18) * scaleY/scaleX baseline
    const customFontsize=Math.max(18,Math.min(64,Math.round(screenFs*scaleY*0.85)));
    const payload={style:activeStyle,customX,customY,customWidth,customFontsize};
    if(activeStyle==='custom'&&activeHex)payload.customHex=activeHex;
    try{
      const r=await fetch(`${API}/api/projects/${projectId}/cuts/${c.id}/restyle`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!r.ok)throw new Error('http '+r.status);
      c.headlineStyle=activeStyle==='custom'?(activeHex||'custom'):activeStyle;
      status.textContent='Salvo · será aplicado no export';
      allBtns.forEach(b=>b.disabled=false);
      setTimeout(()=>status.textContent='',2000);
    }catch(err){
      status.textContent='Erro: '+err.message;
      allBtns.forEach(b=>b.disabled=false);
    }
  });
}

async function approve(id){
  const c=allCuts.find(x=>x.id===id);if(!c)return;
  c.status='approved';
  try{await fetch(`${API}/api/projects/${projectId}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cutId:id})});}catch(e){}
  render();
}
async function reject(id){
  const c=allCuts.find(x=>x.id===id);if(!c)return;
  c.status='rejected';
  try{await fetch(`${API}/api/projects/${projectId}/cuts/${id}/reject`,{method:'POST'});}catch(e){}
  render();
}

function download(id){alert('Exportar / baixar · '+id);}
function edit(id){alert('Editar / recortar · '+id);}
function upload(){alert('Upload de novo vídeo (em breve)');}

function setFilter(cat,el){
  activeFilter=cat;
  document.querySelectorAll('.nav-item').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  render();
}
function setSort(v){activeSort=v;render();}

function toggleSelectMode(){
  selectMode=!selectMode;
  document.getElementById('selbtn').style.borderColor=selectMode?'var(--text)':'';
  document.getElementById('selbtn').style.color=selectMode?'var(--text)':'';
  if(!selectMode)selected.clear();
  render();
}
function clearSel(){selected.clear();selectMode=false;document.getElementById('selbtn').style.borderColor='';document.getElementById('selbtn').style.color='';render();}

async function bulkApprove(){
  const ids=[...selected];
  for(const id of ids){
    const c=allCuts.find(x=>x.id===id);
    if(c)c.status='approved';
  }
  try{await fetch(`${API}/api/projects/${projectId}/approve-all`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});}catch(e){}
  selected.clear();render();
}
async function bulkReject(){
  for(const id of selected){
    const c=allCuts.find(x=>x.id===id);
    if(c)c.status='rejected';
  }
  selected.clear();render();
}
function bulkExport(){alert('Exportar '+selected.size+' cortes (em breve)');}

loadCuts();
</script>
